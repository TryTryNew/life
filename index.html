<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life">
<title>Life · 成為她</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F7F3EE; --card:#FFFFFF; --ink:#3F3A36; --muted:#8C847C; --line:#E8E1D8; --soft:#EFE9E1;
    --joy:#D9A441; --joy-bg:#F6EBD2;
    --accept:#C98585; --accept-bg:#F5E3E1;
    --forward:#7E9E7A; --forward-bg:#E3EDE1;
    --back:#9A8BB8; --back-bg:#ECE7F3;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;font-size:15px;line-height:1.6}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
  .serif{font-family:"Noto Serif TC",serif}

  /* header */
  header.top{position:sticky;top:0;z-index:20;background:rgba(247,243,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 18px 10px;border-bottom:1px solid var(--line)}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-family:"Noto Serif TC",serif;font-weight:700;font-size:20px;letter-spacing:.5px}
  .brand small{display:block;font-family:"Noto Sans TC";font-weight:400;font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:-2px}
  .icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .icon-btn:active{background:var(--soft)}
  .search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 12px}
  .search input{border:0;outline:0;flex:1;background:transparent;font-size:14px}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}

  /* chips */
  .chip{flex:none;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.on{color:var(--ink);font-weight:500}
  .chip[data-tag="joy"].on{background:var(--joy-bg);border-color:var(--joy)}
  .chip[data-tag="accept"].on{background:var(--accept-bg);border-color:var(--accept)}
  .chip[data-tag="forward"].on{background:var(--forward-bg);border-color:var(--forward)}
  .chip[data-tag="back"].on{background:var(--back-bg);border-color:var(--back)}
  .chip[data-tag="all"].on,.chip[data-tag="none"].on{background:var(--soft);border-color:var(--muted)}

  main{padding:14px 14px 0}

  /* composer */
  .composer{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;margin-bottom:18px}
  .composer textarea{width:100%;border:0;outline:0;resize:none;min-height:46px;font-size:15px;background:transparent;line-height:1.6}
  .composer textarea::placeholder{color:#B5ADA4}
  .composer .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
  .composer .bar{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;gap:8px}
  .composer .tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
  .tool{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:12px;color:var(--muted);font-size:13px;white-space:nowrap;flex:none}
  .send{flex:none;white-space:nowrap}
  .when-row{display:flex;justify-content:flex-end;margin-top:6px}
  .tool:active{background:var(--soft)}
  .send{background:var(--ink);color:#fff;padding:7px 18px;border-radius:999px;font-size:14px;font-weight:500}
  .send:disabled{opacity:.35}
  .preview{position:relative;margin:4px 0 8px;border-radius:14px;overflow:hidden;max-width:220px}
  .preview img{display:block;width:100%}
  .preview .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:14px}
  .preview .ed{position:absolute;bottom:6px;right:6px;background:rgba(255,255,255,.9);padding:3px 10px;border-radius:999px;font-size:12px}
  .when{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .when input{border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:var(--bg);font-size:12px}

  /* feed */
  .day-head{display:flex;align-items:baseline;gap:8px;margin:20px 4px 8px}
  .day-head b{font-family:"Noto Serif TC",serif;font-size:17px}
  .day-head span{font-size:12px;color:var(--muted)}
  .post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;position:relative}
  .post .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
  .post .more{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .post .act{font-weight:700;margin-bottom:2px}
  .post .txt{white-space:pre-wrap;word-break:break-word}
  .post .ph{margin-top:10px;border-radius:14px;overflow:hidden;background:var(--soft);position:relative}
  .post .ph img{display:block;width:100%;max-height:520px;object-fit:cover}
  .post .ph .swap{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.88);font-size:12px;padding:3px 10px;border-radius:999px}
  .tagpill{display:inline-flex;align-items:center;gap:3px;padding:1px 9px;border-radius:999px;font-size:12px;color:var(--ink)}
  .tagpill.joy{background:var(--joy-bg)} .tagpill.accept{background:var(--accept-bg)} .tagpill.forward{background:var(--forward-bg)} .tagpill.back{background:var(--back-bg)}
  .post.joy{border-left:4px solid var(--joy)} .post.accept{border-left:4px solid var(--accept)} .post.forward{border-left:4px solid var(--forward)} .post.back{border-left:4px solid var(--back)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

  /* wall */
  .wall{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:14px;overflow:hidden}
  .wall .cell{aspect-ratio:1/1;background:var(--soft);position:relative;overflow:hidden}
  .wall .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .wall .cell i{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff}
  .wall .cell i.joy{background:var(--joy)} .wall .cell i.accept{background:var(--accept)} .wall .cell i.forward{background:var(--forward)} .wall .cell i.back{background:var(--back)}
  .wall-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 10px}
  .wall-head b{font-family:"Noto Serif TC",serif;font-size:18px}
  .wall-head span{font-size:12px;color:var(--muted)}

  /* her */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 8px;font-family:"Noto Serif TC",serif;font-size:16px}
  .her-hero{text-align:center;padding:26px 16px;background:linear-gradient(160deg,#FBF4E6 0%,#F7E9E7 50%,#EAF0E7 100%)}
  .her-hero .lbl{font-size:12px;color:var(--muted);letter-spacing:2px}
  .her-hero .words{font-family:"Noto Serif TC",serif;font-size:22px;font-weight:700;margin:8px 0 6px;line-height:1.5}
  .her-hero .motto{font-size:13px;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{border-radius:14px;padding:10px 4px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px}
  .stat.joy{background:var(--joy-bg)} .stat.accept{background:var(--accept-bg)} .stat.forward{background:var(--forward-bg)} .stat.back{background:var(--back-bg)}
  .week{display:flex;justify-content:space-between;margin-top:12px}
  .week div{text-align:center;font-size:11px;color:var(--muted);flex:1}
  .week i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
  .week i.on{background:var(--forward-bg);border-color:var(--forward)}
  .week i.today{outline:2px solid var(--ink);outline-offset:1px}
  .scn{border-top:1px dashed var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
  .scn:first-of-type{border-top:0}
  .scn .s{font-size:13px;color:var(--muted)}
  .scn .a{font-weight:500}
  .scn button{margin-left:auto;color:#C2B9AF;font-size:13px}
  .field{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg);outline:0;margin-bottom:8px;font-size:14px}
  .btn{display:inline-block;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px}
  .btn.ghost{background:var(--soft);color:var(--ink)}
  .small{font-size:12px;color:var(--muted)}

  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
  nav.tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#B5ADA4}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button.on{color:var(--ink)}

  /* sheets / modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(40,34,30,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--safe-b));max-height:92vh;overflow:auto}
  .sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
  .menu button{display:block;width:100%;text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);font-size:15px}
  .menu button.danger{color:#B4574F}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:60;background:#191614;display:flex;flex-direction:column}
  .lb .lb-top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:12px 14px;font-size:13px}
  .lb .lb-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .lb .lb-img img{max-width:100%;max-height:100%;object-fit:contain}
  .lb .lb-cap{color:#EDE6DE;padding:12px 18px calc(18px + var(--safe-b));white-space:pre-wrap;font-size:14px;max-height:30vh;overflow:auto}

  /* story editor */
  .ed{position:fixed;inset:0;z-index:70;background:#1E1B19;display:flex;flex-direction:column;touch-action:none}
  .ed-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;gap:8px}
  .ed-top .r{display:flex;gap:8px}
  .ed-pill{background:rgba(255,255,255,.14);color:#fff;padding:7px 14px;border-radius:999px;font-size:14px;white-space:nowrap;flex:none}
  .ed-pill.main{background:#fff;color:var(--ink);font-weight:500}
  .ed-stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 10px}
  .ed-stage{position:relative;max-width:100%;max-height:100%}
  .ed-stage img{display:block;max-width:100%;max-height:calc(100vh - 210px);user-select:none;-webkit-user-drag:none;pointer-events:none}
  .layer{position:absolute;transform:translate(-50%,-50%);white-space:pre;text-align:center;font-weight:700;line-height:1.25;cursor:grab;user-select:none;padding:.12em .45em;border-radius:.4em;touch-action:none}
  .layer.sel{outline:1.5px dashed rgba(255,255,255,.85);outline-offset:4px}
  .ed-bottom{padding:10px 12px calc(12px + var(--safe-b));color:#fff}
  .ed-row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .ed-row::-webkit-scrollbar{display:none}
  .sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
  .sw.on{border-color:#fff;transform:scale(1.15)}
  .ed-row input[type=range]{flex:1;accent-color:#fff}
  .ed-input{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .ed-input textarea{width:100%;max-width:480px;background:transparent;border:0;outline:0;color:#fff;font-size:26px;font-weight:700;text-align:center;resize:none;min-height:120px}

  /* login */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:linear-gradient(170deg,#FBF4E6 0%,#F7E9E7 55%,#EAF0E7 100%)}
  .login h1{font-family:"Noto Serif TC",serif;font-size:30px;margin:0 0 6px}
  .login p{color:var(--muted);margin:0 0 26px}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:11px 22px;border-radius:999px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .uidbox{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;word-break:break-all;max-width:420px}
  .toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ 登入畫面 ============ -->
<div id="login" class="login hidden">
  <div style="font-size:42px">🌱</div>
  <h1>成為她</h1>
  <p>喜樂・接受自己・一步一步往前</p>
  <button class="gbtn" id="loginBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    用 Google 登入
  </button>
  <div id="loginMsg" class="small" style="margin-top:14px"></div>
  <div id="noPerm" class="hidden">
    <div class="uidbox">這個帳號目前沒有讀寫權限。<br>如果這是你的帳號，把下面這串 UID 貼到 Firebase 安全規則裡：<br><b id="noPermUid"></b></div>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:center">
      <button class="btn ghost" onclick="copyText(document.getElementById('noPermUid').textContent)">複製 UID</button>
      <button class="btn ghost" onclick="logout()">換帳號</button>
    </div>
  </div>
</div>

<!-- ============ 主畫面 ============ -->
<div id="app" class="app hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand">成為她<small id="headerSub">喜樂・接受自己・往前</small></div>
      <button class="icon-btn" id="searchToggle" aria-label="搜尋">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </div>
    <div class="search hidden" id="searchBox">
      <svg width="16" height="16" fill="none" stroke="#B5ADA4" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="搜尋記錄…">
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <main>
    <!-- 記錄 -->
    <section id="view-feed">
      <div class="composer" id="composer">
        <textarea id="cText" rows="2" placeholder="今天哪個時刻，我有一點像她？"></textarea>
        <div id="cPreview" class="preview hidden">
          <img id="cPreviewImg" alt="">
          <button class="x" id="cRemovePhoto" aria-label="移除照片">✕</button>
          <button class="ed" id="cEditPhoto">編輯</button>
        </div>
        <div class="tags" id="cTags"></div>
        <div class="bar">
          <div class="tools">
            <button class="tool" id="cPhotoBtn">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.5-2h5L16 5"/></svg>照片
            </button>
            <button class="tool" id="cPromptBtn">💭 提示</button>
          </div>
          <button class="send" id="cSend" disabled>記下</button>
        </div>
        <div class="when-row"><span class="when" id="cWhen"><input type="date" id="cDate"><input type="time" id="cTime"></span></div>
        <input type="file" id="cFile" accept="image/*" class="hidden">
      </div>
      <div id="feed"></div>
    </section>

    <!-- 照片牆 -->
    <section id="view-wall" class="hidden">
      <div class="wall-head"><b>照片牆</b><span id="wallCount"></span></div>
      <div class="wall" id="wall"></div>
    </section>

    <!-- 她 -->
    <section id="view-her" class="hidden">
      <div class="card her-hero">
        <div class="lbl">我想成為的人</div>
        <div class="words" id="herWords">喜樂・接受自己・有上進心往前</div>
        <div class="motto" id="herMotto">她也會失敗，只是會回來。</div>
        <button class="small" style="margin-top:10px;text-decoration:underline" id="herEditBtn">編輯</button>
      </div>

      <div class="card">
        <h3>這一週的她</h3>
        <div class="stats" id="stats"></div>
        <div class="week" id="week"></div>
        <div class="small" style="margin-top:10px;text-align:center" id="weekNote"></div>
      </div>

      <div class="card">
        <h3>她會怎麼做？</h3>
        <div class="small" style="margin-bottom:8px">卡住的時候，回來看這裡。每次想到一個情境就加一條，她會越來越完整。</div>
        <div id="scnList"></div>
        <div style="margin-top:10px">
          <input class="field" id="scnS" placeholder="情境：例如「快出門了還在滑手機」">
          <input class="field" id="scnA" placeholder="她會：例如「把手機丟進包包，先穿鞋」">
          <button class="btn" id="scnAdd">加進去</button>
        </div>
      </div>

      <div class="card">
        <h3>設定</h3>
        <div class="small" id="acct"></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost" id="copyUidBtn">複製我的 UID</button>
          <button class="btn ghost" onclick="logout()">登出</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabs"><div class="in">
    <button data-view="feed" class="on">
